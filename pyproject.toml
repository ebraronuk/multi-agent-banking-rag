[project]
name = "multi-agent-banking-rag"
version = "0.1.0"
description = "Reference implementation of a multi-agent, tool-using RAG assistant for a retail-banking support domain (LangGraph + FastMCP + FastAPI)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ebrar Onuk", email = "ebraronuk00@gmail.com" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "langgraph>=0.2.45",
    "langchain-core>=0.3.15",
    "langchain-openai>=0.2.5",
    "langchain-anthropic>=0.3.0",
    "chromadb>=0.5.18",
    "langchain-chroma>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "fastmcp>=0.4.0",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.8.0",
    "structlog>=24.4.0",
    "python-json-logger>=2.0.7",
    "tenacity>=9.0.0",
    "httpx>=0.27.0",
    "slowapi>=0.1.9",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.4",
    "mypy>=1.13.0",
    "types-requests",
    "pre-commit>=4.0.0",
]

[project.urls]
Repository = "https://github.com/ebraronuk/multi-agent-banking-rag"
Documentation = "https://github.com/ebraronuk/multi-agent-banking-rag/blob/main/docs/architecture.md"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["tests/"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --cov=src --cov-report=term-missing"
