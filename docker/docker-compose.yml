services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - CHROMA_PERSIST_DIR=/data/vectorstore
      - MCP_SERVER_HOST=mcp
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - vectorstore:/data/vectorstore
    depends_on:
      - mcp
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "mcp_server.server"]
    ports:
      - "8765:8765"
    env_file:
      - ../.env
    environment:
      # MCP_SERVER_HOST is overloaded: the api service uses it as the hostname
      # to *connect to* (mcp, via Docker DNS); this process uses the same
      # setting to decide what to *bind* to. 127.0.0.1 (the .env default,
      # meant for local-without-Docker dev) would only accept connections from
      # inside this container's own network namespace — 0.0.0.0 is required
      # for the api container to reach it at all.
      - MCP_SERVER_HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      # FastMCP's streamable-HTTP endpoint isn't a plain GET-able health
      # route — it correctly answers with 406 ("client must accept
      # text/event-stream") to a bare GET, which is proof the server is up
      # and routing requests. No `-f`: curl only fails here on an actual
      # connection error, not on that expected 406.
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://localhost:8765/mcp"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    # Conversation memory only — nothing here is worth surviving a crash
    # (RedisMemory/InMemoryMemory both degrade gracefully on a miss, see
    # ADR-008), so no persistence volume: an ephemeral cache, not a database.
    restart: unless-stopped

volumes:
  vectorstore:
