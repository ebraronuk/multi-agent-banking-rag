services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - CHROMA_PERSIST_DIR=/data/vectorstore
      - MCP_SERVER_HOST=mcp
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://demobank:demobank@postgres:5432/demobank
    volumes:
      - vectorstore:/data/vectorstore
    depends_on:
      - mcp
      - redis
      - postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "mcp_server.server"]
    ports:
      - "8765:8765"
    env_file:
      - ../.env
    environment:
      # MCP_SERVER_HOST çift anlamlı: api servisi bunu *bağlanılacak* hostname
      # olarak kullanıyor (mcp, Docker DNS üzerinden); bu süreç aynı ayarı
      # neye *bind* edileceğine karar vermek için kullanıyor. 127.0.0.1 (.env
      # varsayılanı, Docker'sız lokal geliştirme içindir) sadece bu
      # konteynerin kendi ağ namespace'i içinden gelen bağlantıları kabul
      # ederdi — api konteynerinin buraya ulaşabilmesi için 0.0.0.0 gerekiyor.
      - MCP_SERVER_HOST=0.0.0.0
      - DATABASE_URL=postgresql://demobank:demobank@postgres:5432/demobank
    depends_on:
      - postgres
    restart: unless-stopped
    healthcheck:
      # FastMCP'nin streamable-HTTP endpoint'i düz bir GET ile kontrol
      # edilebilir bir health route değil — çıplak bir GET'e doğru şekilde
      # 406 ("client must accept text/event-stream") ile cevap veriyor, bu da
      # sunucunun ayakta olduğunun ve istekleri yönlendirdiğinin kanıtı.
      # `-f` yok: curl burada sadece gerçek bir bağlantı hatasında başarısız
      # olur, beklenen bu 406'da değil.
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://localhost:8765/mcp"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    # Sadece konuşma hafızası — burada bir çökmeye dayanmaya değer hiçbir şey
    # yok (RedisMemory/InMemoryMemory ikisi de bir miss'te zarifçe düşüyor,
    # bkz. ADR-008), o yüzden kalıcılık volume'ü yok: geçici bir önbellek, bir
    # veritabanı değil.
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=demobank
      - POSTGRES_PASSWORD=demobank
      - POSTGRES_DB=demobank
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Resmi postgres imajı buradaki her .sql dosyasını otomatik çalıştırıyor,
      # ama sadece tertemiz (boş) bir veri dizinine karşı — yine de her
      # ifadenin neden idempotent olduğu için bkz. db/schema.sql'in başlığı.
      - ../db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demobank -d demobank"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  vectorstore:
  pgdata:
