apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-agent-config
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  LLM_PROVIDER: "anthropic"
  LLM_MODEL: "claude-sonnet-5"
  EMBEDDING_PROVIDER: "openai"
  CHROMA_PERSIST_DIR: "/data/vectorstore"
  CHROMA_COLLECTION: "banking_kb"
  MCP_SERVER_HOST: "banking-agent-mcp"
  MCP_SERVER_PORT: "8765"
  MAX_AGENT_ITERATIONS: "6"
  REQUEST_TIMEOUT_SECONDS: "30"
---
# Sadece yer tutucu — gerçek sırlar cluster'ın sır yöneticisi üzerinden
# sağlanır (ör. External Secrets Operator / sealed-secrets), asla commit edilmez.
apiVersion: v1
kind: Secret
metadata:
  name: banking-agent-secrets
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "changeme"
  OPENAI_API_KEY: "changeme"
  GOOGLE_API_KEY: "changeme"
  # Sadece API anahtarı değil, bağlantı string'i — kimlik bilgisi içeriyorlar,
  # o yüzden yukarıdaki sağlayıcı anahtarlarıyla birlikte Secret'ta duruyorlar,
  # düz ConfigMap'te değil. İkisi de boşken in-process, kalıcı olmayan bir
  # implementasyona düşüyor (bkz. agents/memory.py, mcp_server/tools/banking_repository.py).
  REDIS_URL: "changeme"
  DATABASE_URL: "changeme"
