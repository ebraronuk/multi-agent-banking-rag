apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-agent-config
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  LLM_PROVIDER: "anthropic"
  LLM_MODEL: "claude-sonnet-5"
  EMBEDDING_PROVIDER: "openai"
  CHROMA_PERSIST_DIR: "/data/vectorstore"
  CHROMA_COLLECTION: "banking_kb"
  MCP_SERVER_HOST: "banking-agent-mcp"
  MCP_SERVER_PORT: "8765"
  MAX_AGENT_ITERATIONS: "6"
  REQUEST_TIMEOUT_SECONDS: "30"
---
# Placeholder only — real secrets are provisioned via the cluster's secret
# manager (e.g. External Secrets Operator / sealed-secrets), never committed.
apiVersion: v1
kind: Secret
metadata:
  name: banking-agent-secrets
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "changeme"
  OPENAI_API_KEY: "changeme"
